[pytest]
# 测试配置文件

# 测试发现
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 异步测试支持
asyncio_mode = auto

# 默认参数
addopts = -v --tb=short

# 自定义标记
markers =
    mock_only: 仅在 mock 模式下运行
    develop_only: 仅在 develop 模式下运行
    integration: 集成测试（使用真实 API）
    asyncio: 异步测试

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
