# LLM Gate 容器内 nginx 反代配置
# uvicorn 监听 127.0.0.1:8000（内部），nginx 按端口分发并隔离管理面/数据面：
#   9000 -> 管理网页（前端 + /api 控制面 + /health），/v1 在此端口 404
#   9981 -> 路由服务（/v1），其余路径在此端口 404

user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 日志输出到容器 stdout/stderr，docker logs 可见
    access_log /dev/stdout;
    error_log  /dev/stderr;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # LLM 请求体可能很大（长上下文 / base64 图片），不限大小避免截断
    client_max_body_size 0;

    # 流式（SSE）转发关键：关缓冲 + 长超时（匹配后端非流式 1800s / 流式 600s 上限）
    proxy_buffering off;
    proxy_cache off;
    proxy_http_version 1.1;
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    upstream llm_gate_backend {
        server 127.0.0.1:8000;
    }

    # ===== 9000：管理网页 + 控制面 =====
    server {
        listen 9000;
        # 数据面在管理端口隔离
        location /v1/ {
            return 404;
        }
        location / {
            proxy_pass http://llm_gate_backend;
        }
    }

    # ===== 9981：路由服务（/v1） =====
    server {
        listen 9981;
        # 管理面在数据端口隔离
        location / {
            return 404;
        }
        location /v1/ {
            proxy_pass http://llm_gate_backend;
        }
    }
}
